apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-sish
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/wHoIsDReAmer/lab.git
    targetRevision: main
    path: clusters/k3s/apps/sish
  destination:
    server: https://kubernetes.default.svc
    namespace: sish
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ "CreateNamespace=true" ]
