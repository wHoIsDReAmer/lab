apiVersion: apps/v1
kind: Deployment
metadata:
  name: ggez-auth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ggez-auth
  template:
    metadata:
      labels:
        app: ggez-auth
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ggez-auth
          image: ggez-auth:7e6c274bcd31
          imagePullPolicy: Never
          env:
            - name: GG_AUTH_BIND
              value: 0.0.0.0:47733
            - name: GG_AUTH_DB
              value: /data/ggez-auth.sqlite3
            - name: GG_AUTH_TOKEN_TTL_SECONDS
              value: "300"
            - name: GG_AUTH_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: ggez-auth-signing-key
                  key: GG_AUTH_SIGNING_KEY
          ports:
            - name: http
              containerPort: 47733
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ggez-auth-data
